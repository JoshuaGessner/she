; Export presets — tracked, not ignored (ADR-086).
;
; This file used to be in .gitignore, which is the common default and was wrong
; here: it is the only place the export configuration lives, so ignoring it made
; "works in an exported build" — a Definition of Done line — unreproducible by
; anyone but the machine that happened to hold it. Nothing secret goes in here.
; Signing identities and notarisation credentials stay out and arrive from the
; environment if they are ever needed.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Project SHE"
application/product_name="SHE"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

[preset.1]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

export/distribution_type=0
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="dev.gessner.she"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright=""
application/min_macos_version_x86_64="10.12"
application/min_macos_version_arm64="11.00"
display/high_res=true
; Unsigned on purpose. The macOS export exists to prove the *packed* build
; runs, which is the Definition of Done claim; signing and notarisation are a
; distribution concern and would need credentials this repo must never hold.
codesign/codesign=0
notarization/notarization=0
privacy/microphone_usage_description=""
privacy/camera_usage_description=""
privacy/location_usage_description=""
ssh_remote_deploy/enabled=false
